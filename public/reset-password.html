<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/Vridhi_logo.jpeg">
    <title>Reset Password | Vridhi</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        body {
            background: linear-gradient(135deg, #0A2342 0%, #173b6c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .reset-card {
            background: #ffffff;
            max-width: 440px;
            width: 100%;
            border-radius: 14px;
            padding: 36px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: left;
        }
        .brand {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #0A2342;
            margin-bottom: 4px;
        }
        .brand span {
            color: #50C878;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #50C878;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #50C878;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #43a047;
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #status-msg {
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        #status-msg.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }
        #status-msg.success {
            background: #dcfce7;
            color: #15803d;
            display: block;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0284c7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="brand">Vridhi <span>वृद्धि</span></div>
        <div class="subtitle">Set a new password for your account</div>

        <form id="reset-password-form">
            <div class="input-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" placeholder="At least 6 characters" required minlength="6">
            </div>

            <div class="input-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" placeholder="Confirm new password" required minlength="6">
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">Reset Password</button>
            <div id="status-msg"></div>
        </form>

        <a href="/" class="back-link">&larr; Back to Login</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const form = document.getElementById('reset-password-form');
        const statusMsg = document.getElementById('status-msg');
        const submitBtn = document.getElementById('submit-btn');

        if (!token) {
            statusMsg.className = 'error';
            statusMsg.innerText = 'No password reset token found in URL. Please use the link provided in your email.';
            submitBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                statusMsg.className = 'error';
                statusMsg.innerText = 'Passwords do not match.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Updating Password...';
            statusMsg.style.display = 'none';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });

                const data = await res.json();
                if (data.success) {
                    statusMsg.className = 'success';
                    statusMsg.innerText = data.message;
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2500);
                } else {
                    statusMsg.className = 'error';
                    statusMsg.innerText = data.error || 'Failed to reset password.';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Reset Password';
                }
            } catch (err) {
                statusMsg.className = 'error';
                statusMsg.innerText = 'Network error. Please try again.';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Reset Password';
            }
        });
    </script>
</body>
</html>
